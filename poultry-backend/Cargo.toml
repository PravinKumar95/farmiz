[package]
name = "poultry-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum="0.8.9"
lambda_http="1.2.1"
tokio={ version = "1.39.0", features = ["full"] }
serde="1.0.188"
serde_json="1.0.114"
sqlx = { version = "0.9", features = ["runtime-tokio", "any", "postgres", "tls-rustls", "uuid", "chrono"] }
dotenv = "0.15.0"
uuid = { version = "1.10.0", features = ["serde", "v4"] }
chrono = { version = "0.4.38", features = ["serde"] }
jsonwebtoken = { version = "10.4.0", features = ["ed25519-dalek"] }
reqwest = { version = "0.13.4", features = ["json"] }
once_cell = "1.21.4"
tower-http = { version = "0.7.0", features = ["cors"] }
