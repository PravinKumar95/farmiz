name: Playwright E2E Tests

on:
  # Scheduled daily run at 00:00 UTC (5:30 AM IST)
  schedule:
    - cron: '0 0 * * *'

  # Manual execution from the GitHub Actions UI tab
  workflow_dispatch:
    inputs:
      e2e_email:
        description: 'Optional: E2E Real User Email'
        required: false
        type: string

  # Run on pull requests to main
  pull_request:
    branches: ["main"]

jobs:
  playwright-e2e:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './poultry-app/package-lock.json'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI (Pinned to 0.7.9)
        run: cargo binstall dioxus-cli --version 0.7.9 -y

      - name: Install npm dependencies
        working-directory: ./poultry-app
        run: npm ci

      - name: Install Playwright Chromium Browser & OS Dependencies
        working-directory: ./poultry-app
        run: npx playwright install --with-deps chromium

      - name: Build Tailwind CSS
        working-directory: ./poultry-app
        run: npx @tailwindcss/cli -i input.css -o assets/tailwind.css

      - name: Build Dioxus App (Pre-cache WASM binary)
        working-directory: ./poultry-app
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://orcdvylxbbvafrfjlltap3fa2i0vzmtp.lambda-url.us-east-1.on.aws' }}
        run: dx build

      - name: Run Playwright E2E Tests
        working-directory: ./poultry-app
        env:
          E2E_EMAIL: ${{ inputs.e2e_email || secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://orcdvylxbbvafrfjlltap3fa2i0vzmtp.lambda-url.us-east-1.on.aws' }}
        run: npm run test:e2e

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ./poultry-app/playwright-report/
          retention-days: 30

      - name: Send Email Report Notification
        uses: dawidd6/action-send-mail@v4
        if: always() && env.MAIL_USERNAME != ''
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Poultry App E2E Test Report - Status: ${{ job.status }}"
          to: pravinshanmugam1995@gmail.com
          from: Farmiz E2E Test Runner <${{ secrets.MAIL_USERNAME }}>
          body: |
            Playwright E2E Test execution for Poultry App completed.

            Status: ${{ job.status }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Triggered By: ${{ github.event_name }}
            
            View detailed test run, logs, and HTML report:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          secure: true
