name: Playwright E2E Tests

on:
  # Allows manual execution from the GitHub Actions tab UI
  workflow_dispatch:
    inputs:
      e2e_email:
        description: 'Optional: E2E Real User Email'
        required: false
        type: string
      run_against_staging:
        description: 'Run tests against deployed staging URL'
        required: false
        type: boolean
        default: false

  # Optional: Automatically run on pull requests to main
  pull_request:
    branches: ["main"]

jobs:
  playwright-e2e:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './poultry-app/package-lock.json'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: cargo binstall dioxus-cli -y

      - name: Install npm dependencies
        working-directory: ./poultry-app
        run: npm ci

      - name: Install Playwright Chromium Browser & OS Dependencies
        working-directory: ./poultry-app
        run: npx playwright install --with-deps chromium

      - name: Build Tailwind CSS
        working-directory: ./poultry-app
        run: npx @tailwindcss/cli -i input.css -o assets/tailwind.css

      - name: Build Dioxus App (Pre-cache WASM binary)
        working-directory: ./poultry-app
        run: dx build

      - name: Run Playwright E2E Tests
        working-directory: ./poultry-app
        env:
          E2E_EMAIL: ${{ inputs.e2e_email || secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: npm run test:e2e

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ./poultry-app/playwright-report/
          retention-days: 30
