name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node (for Tailwind)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: cargo binstall dioxus-cli --version 0.7.1 -y

      - name: Build Tailwind CSS
        working-directory: ./poultry-app
        run: |
          npm install tailwindcss @tailwindcss/cli
          npx @tailwindcss/cli -i tailwind.css -o assets/tailwind.css

      - name: Build Dioxus App
        working-directory: ./poultry-app
        run: |
          dx build --release --base-path /farmiz/
          sed -i 's|<head>|<head><base href="/farmiz/" />|' ../target/dx/poultry-app/release/web/public/index.html

      - name: Patch WASM asset paths
        working-directory: ./target/dx/poultry-app/release/web/public/assets
        run: |
          # The Dioxus WASM runtime hardcodes "/assets/" for dynamic CSS injections.
          # This breaks on GitHub Pages subpaths because it ignores the <base> tag.
          # We patch the WASM binary directly to use "assets//" (relative) instead.
          python3 -c '
          import glob
          for wasm_file in glob.glob("*.wasm"):
              with open(wasm_file, "rb") as f:
                  data = f.read()
              data = data.replace(b"\xc0\x08/assets/\x00", b"\xc0\x08assets//\x00")
              with open(wasm_file, "wb") as f:
                  f.write(data)
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './target/dx/poultry-app/release/web/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

