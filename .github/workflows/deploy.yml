name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node (for Tailwind)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: cargo binstall dioxus-cli -y

      - name: Build Tailwind CSS
        working-directory: ./poultry-app
        run: |
          npm install tailwindcss @tailwindcss/cli
          npx @tailwindcss/cli -i input.css -o assets/tailwind.css

      - name: Setup Node for Dioxus build
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Dioxus App
        working-directory: ./poultry-app
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          dx bundle --release --out-dir docs
          mv docs/public/* docs
          cp docs/index.html docs/404.html


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./poultry-app/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

